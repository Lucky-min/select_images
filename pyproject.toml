[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "select-images"
version = "0.1.0"
description = "Select the best photo from burst-shot groups to reduce redundant images."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["Pillow>=10.0"]

[project.scripts]
select-images = "select_images.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
